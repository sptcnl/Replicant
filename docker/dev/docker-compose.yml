services:
    nginx:
        image: nginx:alpine
        container_name: nginx
        ports:
            - "80:80"
            - "443:443"
        environment:
            - SERVER_NAME=${SERVER_NAME}
        volumes:
            - ./nginx/conf.d:/etc/nginx/conf.d
            - certbot_conf:/etc/letsencrypt
            - certbot_www:/var/www/certbot
            - ../../backend/static:/static:ro
            - ../../backend/media:/media
        entrypoint: /bin/sh -c "envsubst '${SERVER_NAME}' < /etc/nginx/conf.d/default.conf > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
        depends_on:
            - web
        networks:
            - app-network
    
    certbot:
        container_name: certbot
        image: certbot/certbot
        restart: unless-stopped
        volumes:
            - certbot_conf:/etc/letsencrypt
            - certbot_www:/var/www/certbot
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
        networks:
            - app-network
    
    postgres:
        image: postgres:15
        container_name: postgres15
        environment:
            - POSTGRES_DB=postgres
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        restart: unless-stopped
        networks:
            - app-network

    channels_redis:
        image: redis:8
        container_name: channels_redis
        command: redis-server --save 60 1 --loglevel warning
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data
        networks:
            - app-network

    web:
        build: 
            context: ../..
            dockerfile: docker/dev/Dockerfile
        container_name: django_app
        command: > 
            sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
        volumes:
            - ../../backend:/app
            - ../../backend/static:/app/static
        ports:
            - "8000:8000"
        environment:
            - DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres
            - REDIS_URL=redis://channels_redis:6379
            - DJANGO_SETTINGS_MODULE=config.settings
        depends_on:
            - postgres
            - channels_redis
        networks:
            - app-network

volumes:
    redisdata: {}
    pgdata: {}
    certbot_conf: {}
    certbot_www: {}

networks:
    app-network:
        driver: bridge